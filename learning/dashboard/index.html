<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Knowledge Map</title><style>body{font:16px system-ui,"Microsoft YaHei",sans-serif;max-width:1100px;margin:28px auto;padding:0 18px;color:#172033;background:#f8fafc;line-height:1.55}h1{margin-bottom:2px}.note,.tag{color:#536276}.tabs button{margin:10px 8px 18px 0;padding:8px 12px;border:1px solid #8190a5;border-radius:7px;background:#fff;cursor:pointer}.tabs button.active{background:#173d70;color:#fff}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:16px;margin:12px 0}.pill{font-size:12px;border-radius:12px;padding:3px 8px;background:#e9eff7;color:#1a477d}.partial{background:#fff1cf;color:#805a00}.unresolved{background:#f1e7ef;color:#70345d}.defined{background:#e4f3eb;color:#12613d}.ill{background:#ffe8dc;color:#9b4211}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.label{font-weight:700}.warning{border-left:4px solid #be7724;padding-left:12px}details{margin-top:10px}code{background:#f1f3f6;padding:2px 4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #dbe2ea;text-align:left;vertical-align:top}</style></head><body>

['Pair-Specific Normal Relationship','UNRESOLVED DESIGN REQUIREMENT','如何让 pair 自己的 PIT 历史决定 actual normal relationship，而不事后为它单独加复杂度？','N0/N1 必须共享 prespecified construct、information set、timing 和 validation protocol。','表示、参数、窗口、uncertainty 和 N0/N1 比较均未选择；N2 仅为后续复杂度候选。','N0 baseline; N1 pair-specific; N2 partial pooling','pair relationship = industry prior + pair-specific adjustment','D-015 design requirement only','G2 Measurement & Timing'],
['Continuous Pair-Specific Abnormality','UNRESOLVED DESIGN REQUIREMENT','相对 pair 自身估计的 normal joint behavior 与 uncertainty，departure 有多大？','abnormality 不是已定义 binary divergence trigger。','公式、维度、normalization、uncertainty、fixed/soft/probabilistic trigger 解释均未决。','magnitude; direction; timing; residual; break','abnormality=departure(normal joint behavior, uncertainty)','D-015 design requirement only','G2 Measurement & Timing'],
['Sequential Mechanism & Resolution Updating','PARTIALLY ANSWERED','随 PIT 信息到达，如何共同更新 M0–M3 与 resolution belief？','M1 有 source/link/timing/peer-under-response 边界；M2 有 pressure-source、liquidity-state、price/flow response 与 rival checks 边界；U=Unresolved/Abstain 不是机制。','M1/M2 都不识别个体因果状态；M3/M0、多机制区分、resolution model 和 update structure 未审阅/未选择。','M1 source-link-timing; M2 pressure-source/contamination; event-time provenance','belief(t+1)=update(belief(t),new_PIT_evidence(t+1))','M1-001/008; M2-001/002/003/005; B4-004','G1 evidence review, G2–G4'],

const C=[
['Economic / company proximity','精确定义：同一时点可获得的公司/产品市场描述之间的经济接近性。状态：DEFINED · CANDIDATE SECONDARY PRIOR · NOT CORE · INCLUSION REQUIRES INCREMENTAL VALIDATION。','sim(i,j)=cosine(x(i),x(j)); x 是带日期公司表征。','测量经济接近性；不测量价格依赖、稳定性或可交易性。','可作 prior/context 等候选角色；P1 必须在 relationship-level OOS 上增量胜过 P0。','PF-001 / CL-PF-001'],
['Raw price-path distance','精确定义：共尺度历史价格路径之间的距离。','D(i,j)=sum_t (P(i,t)-P(j,t))^2；P 是归一化价格。','测量历史路径接近；不测量经济联系或未来有效性。','共同形成期、缩放与窗口选择。','PF-004 / CL-PF-002'],

['Residual / factor-adjusted dependence','精确定义：在指定控制模型下未解释的部分。','r(i,t)=B(i)f(t)+e(i,t)；e 是模型残差。','测量条件性偏离；不测量天然经济关系。','因子/复制模型、估计期与 PIT。','PF-008, PF-013 / CL-PF-003, CL-PF-006'],
['Relationship stability / break','精确定义：给定关系随时间的持续性或变化风险。','No universal formula selected.','测量重复/变化的统计描述；不识别 M0。','窗口与断裂检测设定。','PF-006, PF-007 / CL-PF-004, CL-PF-005'],
['False discovery rate (FDR)','精确定义：多重检验中错误发现比例的期望。','FDR=E[V/max(R,1)]；R 为拒绝数，V 为错误拒绝数。','测量统计筛选风险；不测量经济有效性。','检验依赖结构与控制程序。','PF-013 / CL-PF-006'],
['Global matching / overlap','精确定义：在候选关系间控制资产重叠的组合规则。','Illustration: choose edges with each asset used at most once.','测量组合治理；不验证单个 pair。','图、权重和约束。','PF-010 / CL-PF-010']];
const M1=[['M1 source-link-timing chain','精确定义：PIT 方向性经济 link、可时间戳来源事件、经济相符方向、peer 当期未充分吸收和 rival checks 共同支持 candidate M1。','link -> source event -> peer under-response -> candidate M1 -> later validation','测量候选解释链的必要信息；不测量个体 attention state。','private diffusion、common shock、own news、risk、liquidity、stale link。','M1-001, M1-008 / CL-M1-001, CL-M1-003'],['Event-time provenance vs outcome validation','精确定义：decision-time 已知信息与后来结果变量必须分离。','Input_t uses information available by t; future peer return is validation only.','保护因果时点；不证明公开时点就是有效信息到达时点。','daily close 粗粒度、private/pre-release diffusion。','M1-001, M1-008 / CL-M1-001, CL-M1-003']];
const P=[['PF-001','公司/经济相似','产品描述文本表征。','支持经济接近性，不测量价格关系。','CL-PF-001'],['PF-004','raw distance','归一化路径距离与形成/交易期分离。','不证明有效 pair。','CL-PF-002'],['PF-006','stability','协整边重复与存活。','不解释关系失效原因。','CL-PF-004'],['PF-007','break','时频特征下断裂概率。','不是 M0 识别。','CL-PF-005'],['PF-008','residual','sparse replication / elastic net。','不证明经济 link。','CL-PF-003'],['PF-013','FDR','因子调整相关与多重检验控制。','不证明交易价值。','CL-PF-006']];
function pill(x){let c=x==='DEFINED'?'defined':x==='PARTIALLY ANSWERED'?'partial':x==='NOT YET STUDIED'?'unresolved':x==='ILLUSTRATIVE / UNAUTHORIZED FORMULA'?'ill':'';return `<span class="pill ${c}">${x}</span>`}function box(t,b,a){return `<section class="card"><h2>${t}</h2>${b}<p class="tag">${a||''}</p></section>`}function m1detail(){return `<details><summary>M1：已回答、候选观测量与分阶段待决项</summary><p><b>ANSWERED / DEFINED：</b>lead-lag ≠ M1；候选 M1 需要 PIT directional link、timestamped source event、经济相符方向、当期 peer under-response 与 rival/leakage checks。future catch-up 只做验证。</p><p><b>Potential candidate observables：</b>link vintage/materiality；source identity/content/sentiment/first-public time；source 与 peer 的当期反应；peer own-news；market/industry context；pre-event peer move；以及受披露滞后约束的 common ownership/trading context。</p><p>${pill('ILLUSTRATIVE / UNAUTHORIZED FORMULA')} <code>candidate_M1=h(link,source,timing,underresponse,rival_checks)</code> 与 <code>belief(t+1)=update(belief(t),new_PIT_evidence(t+1))</code> 都不是 classifier、Bayesian filter、HMM、state-space model、factor score、threshold 或 M1 label。</p><p><b>G2：</b>定义 trigger、mechanism-discriminator、sequential-updating 三类变量，以及 PIT timing、frequency、lineage、under-response 与 abstention/rejection rules。<b>Later internal validation：</b>测试未来 catch-up，及 private diffusion、common shock、own-news、risk、liquidity、stale link、news endogeneity 等 rival explanations。</p><p><b>Still unresolved：</b>个体 causal attention state、A-share transferability，以及 M2/M3/M0 的多机制区分。</p></details>`}function map(){return S.map((s,i)=>box((i+1)+'. '+s[0]+' '+pill(s[1]),`<p><b>Core research question:</b> ${s[2]}</p><div class="grid"><div><p><b>What we know:</b> ${s[3]}</p><p><b>Defined concepts/models:</b> ${s[5]}</p></div><div><p><b>What remains unresolved:</b> ${s[4]}</p><p><b>Expected resolver:</b> ${s[8]}</p></div></div><details><summary>候选模型 / 因子与证据成熟度</summary><p>${pill('CANDIDATE')} <code>${s[6]}</code></p><p>${pill('ILLUSTRATIVE / UNAUTHORIZED FORMULA')} 未冻结，不可作为项目规格。</p></details>${s[0]==='Sequential Mechanism Tracking + Dynamic Resolution Prediction'?m1detail():''}`,`Evidence maturity / ancestry: ${s[7]}`)).join('')}function concept(){return C.concat(M1).map(c=>box(c[0]+' '+pill('DEFINED'),`<p>${c[1]}</p><details><summary>公式、测量边界、假设与比较</summary><p><code>${c[2]}</code></p><p>${c[3]}</p><p><b>Assumptions / nearby concepts:</b> ${c[4]}</p><p class="warning">DEFINED 只表示定义与边界已知；不表示本项目已选用或冻结。</p></details>`,'Paper / Claim ancestry: '+c[5])).join('')}function candidate(){return box('候选 / 未决模型',`<p>${pill('ILLUSTRATIVE / UNAUTHORIZED FORMULA')} 尚无 Pair Score、mechanism classifier、abnormal-state formula、prediction model 或 trade policy 获授权。</p><table><tr><th>候选</th><th>Illustrative form</th><th>证据动机与未来决定</th></tr><tr><td>N0 / N1 normality</td><td><code>same construct; N0 pooled baseline vs N1 pair PIT history</code></td><td>D-015；同一 prespecification 下比较，不能事后升级。</td></tr><tr><td>N2 partial pooling</td><td><code>pair relationship = industry prior + pair-specific adjustment</code></td><td>仅在 N0/N1 明确显示 bias–variance 或 sample-efficiency 缺口后考虑。</td></tr><tr><td>Continuous abnormality</td><td><code>departure(normal joint behavior, uncertainty)</code></td><td>保留 magnitude/direction/timing/residual/break 维度；不选公式或 trigger。</td></tr><tr><td>Sequential updating</td><td><code>belief(t+1)=update(belief(t),new_PIT_evidence(t+1))</code></td><td>仅架构说明；不选择 Bayesian filter、HMM、state-space model 或 classifier。</td></tr></table>`,'Only frozen decisions and completed audited reviews are represented.')}function paper(){return P.concat([['M1-001','M1 source-link-timing','directional links, source events and timing.','No individual attention label; rivals remain.','CL-M1-001']]).map(p=>box(p[0]+' · Paper Guide',`<p>为什么审阅：${p[1]}。方法：${p[2]}</p><details><summary>项目相关证据与限制</summary><p>${p[3]}</p><p>完整指南：<code>learning/paper-guides/${p[0]}.md</code></p></details>`,'Claim ancestry: '+p[4])).join('')}function render(v){app.innerHTML=v==='map'?map():v==='concept'?concept():v==='candidate'?candidate():paper()}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view)});render('map');
</script></body></html>
