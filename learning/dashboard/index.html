ackground:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px;box-shadow:var(--shadow)}.mechanism{cursor:pointer;border-top:5px solid var(--teal);transition:.15s}.mechanism:hover,.mechanism:focus{transform:translateY(-2px);border-color:var(--navy);outline:none}.mechanism.m0{border-top-color:var(--red)}.mechanism.m3{border-top-color:var(--purple);background:#fff8ff}.mechanism.u{border-top-color:var(--gold);background:#fffbf2}.card h3{margin:0 0 7px;font-size:19px}.money{font-weight:650;color:var(--green)}.pill{display:inline-block;border-radius:999px;padding:3px 8px;margin:2px 3px 2px 0;font-size:11px;font-weight:700;background:#e7edf2;color:#345}.frozen,.reviewed{background:#dff0e7;color:#226044}.partial,.g2{background:#fff0cf;color:#7b5513}.blocked,.weak{background:#f8dfe3;color:#8b2f3b}.unresolved,.pending{background:#ece5f0;color:#62446d}.notstarted{background:#e8ebee;color:#56616c}.unauth{background:#ffe4d5;color:#8f431a}.callout{border-left:5px solid var(--gold);background:#fff8e8;padding:12px 15px;margin:16px 0;border-radius:4px}.danger{border-left-color:var(--red);background:#fff0f1}.muted{color:var(--muted)}.ancestry{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:12px}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);gap:16px}.detailnav,.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.detailnav button,.filters button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;cursor:pointer}.detailnav button.active,.filters button.active{background:var(--teal);color:white}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fact{border-bottom:1px solid var(--line);padding:9px 0}.fact b{display:block;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.progress{display:grid;grid-template-columns:minmax(180px,1.4fr) 1fr}.progress div{padding:8px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}th{position:sticky;top:52px;background:#e9edf0;color:var(--navy)}.formula{font-family:"Cascadia Code",Consolas,monospace;background:#f0eee9;padding:8px;border-radius:6px;overflow:auto}.back{border:0;background:none;color:var(--navy);padding:0;cursor:pointer;font-weight:700}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:650;color:var(--navy)}@media(max-width:850px){.pipeline{grid-template-columns:1fr 1fr}.step:after{display:none}.split{grid-template-columns:1fr}.facts{grid-template-columns:1fr}th{position:static}}@media(max-width:520px){.pipeline{grid-template-columns:1fr}header h1{font-size:24px}main{padding:18px 14px 45px}header,nav{padding-left:14px;padding-right:14px}}
</style></head><body><header><div class="eyebrow">Mechanism-Aware Statistical Arbitrage · Learning Layer</div><h1>Research Knowledge Map</h1><p class="subtitle">研究进度与机制—信号路径的可解释界面。Learning Layer 只解释 Evidence → Decision，不是证据来源。</p><div class="statusline"><span class="pill frozen">G1 FROZEN</span><span class="pill frozen">G2-01 FROZEN</span><span class="pill pending">G2-02 PROPOSED / AWAITING APPROVAL</span><span class="pill pending">G2-03 NOT AUTHORIZED</span><span class="pill unauth">NO MODEL / FACTOR / RULE SELECTED</span></div></header>

const stages=[['Company Representation','PARTIAL','经济/公司信息是 secondary candidate prior；不允许人工 pair。','G2/G3：P1 表征、PIT vintage 与增量验证。','PF-001 · CL-PF-001'],['Industry-Specific Relationship Prior','G2-02 PROPOSED','P0 保留五类非等价 PIT market information；P1 是 unchanged P0 + separate slow economic/company layer。','Researcher approval；表示、metric、winner 仍未选择。','D-016/017 · CL-PF-001–010 · G2-02 proposal'],['Pair-Specific Normal Relationship','G2 PENDING','G2-01 已冻结 joint-conditional + directional-response semantics。','G2-03：N0/N1；N2 escalation；表示/窗口/uncertainty。','G2-01 · D-015–017'],['Continuous Pair-Specific Abnormality','UNRESOLVED','是相对 relationship state + uncertainty 的 departure，不是既定 binary trigger。','G2：维度、normalization、score/soft/probabilistic interpretation。','D-015/017 · G2-01'],['Sequential Mechanism & Resolution Updating','PARTIAL','M1/M2 有 literature-supported evidence components；M3 non-identified；U epistemic。','G2：discriminators、update roles、resolution objects；不强制分类。','CL-M1-001/003 · CL-M2-001–004 · G1-04'],['Trade / Update / Reject / Abstain','NOT STARTED','No-trade、rejection、ambiguity、abstention 是合法结果。','Later gates：policy、costs、constraints、OOS economics。','D-014 · G1-04']];
const mech={
M0:{name:'Structural / Fundamental / Rejection',kind:'economic hypothesis',tone:'m0',definition:'需要正向 structural、fundamental、stale-link、persistent-break 或 constraint evidence，表明套利解释可能失效。不能由排除法得到。',opportunity:'False-opportunity rejection',money:'避免持续背离损失、保存资本与机会容量；不推断已实现收益。',resolution:'后续持续或 relationship break 仅用于验证 rejection quality。',maturity:'REVIEWED / PARTIAL',ident:'POSITIVE REJECTION EVIDENCE REQUIRED',known:'positive rejection evidence 可进入 G2 measurement design。',unknown:'break/materiality/timing、与 temporary abnormality 的区分、A-share transferability。',rivals:'M1、M2、M3、temporary noise、measurement failure。',pit:'dated fundamental/company news；relationship/link change；persistent break；lawful funding/constraint context。',signal:'P relationship credibility + S abnormality + R positive invalidation/rival evidence。',model:'reject_belief_t = h(structure, fundamentals, break, funding, rivals)',ancestry:'D-014–017; G1-04; CL-M0-001; CL-PF-001/004/005'},
M1:{name:'Delayed Information Incorporation',kind:'economic hypothesis',tone:'',definition:'已识别关联信息出现后，peer 尚未沿 expected signed direction 充分响应。Observed lead–lag ≠ M1 identified。',opportunity:'Follower catch-up',money:'若 PIT attribution 与方向/时点成立，后续 follower adjustment 可能提供收益；盈利尚未被证明。',resolution:'future signed follower catch-up；validation only。',maturity:'REVIEWED / PARTIAL',ident:'COMPONENT EVIDENCE, NOT EVENT LABEL',known:'source/link/timing、signed under-response、rival checks 可更新 M1 belief。',unknown:'under-response measure、causal attention state、horizon/effect、A-share transferability。',rivals:'common shock、private diffusion、peer own-news、stale link、risk、liquidity、M2/M0。',pit:'link vintage/direction；first-public source event；source/peer response through t；peer news；market/industry context。',signal:'P directional relation + S abnormal response + C source/link/timing + R rival checks。',model:'P(M1 | F_t) or mechanism-specific belief function',ancestry:'D-014/017; G1-04; CL-M1-001/003; M1-001/M1-008'},
M2:{name:'Temporary Liquidity / Flow Pressure',kind:'economic hypothesis',tone:'',definition:'shocked/source asset 可能因 temporary pressure 相对 expected conditional response 移动过度。',opportunity:'Source normalization / reversal',money:'若 temporary over-movement 可在 PIT 下合理区分，逆向 exposure 可能捕获 reversal；盈利尚未被证明。',resolution:'future source reversal/normalization；validation only。',maturity:'REVIEWED / PARTIAL',ident:'SOURCE + STATE + RESPONSE + RIVALS',known:'pressure-source、liquidity-state、abnormal response、contamination/rival checks 可更新 belief。',unknown:'exogeneity、proxy contamination、over-response measure、horizon、A-share transferability。',rivals:'information repricing、M1、shortage vs oversupply、fundamentals、microstructure、M0。',pit:'released pressure context；lagged overlap；known calendar/settlement；price/flow/quotes/liquidity through t；rival news。',signal:'P conditional relation + S over-movement + C pressure/liquidity + R contamination/information checks。',model:'P(M2 | F_t) or mechanism-specific belief function',ancestry:'D-014/017; G1-04; CL-M2-001–004; CL-B4-002'},
M3:{name:'Temporary Idiosyncratic Dislocation',kind:'economic hypothesis',tone:'m3',definition:'candidate temporary idiosyncratic relative dislocation；当前没有正向 contemporaneous identification。Unexplained abnormality ≠ M3。',opportunity:'Candidate relative normalization',money:'只有未来出现正向 PIT identification 与 resolution prediction 才可能讨论 monetization；目前不能推断。',resolution:'future normalization；validation only，不能反推 event-time M3。',maturity:'REVIEWED / WEAK',ident:'WEAK / NON-IDENTIFIED',known:'fundamental/news controls 与 residual movement 仅可作 descriptive/rejection context。',unknown:'positive ancestry、discriminator、causal source、horizon、transferability。',rivals:'omitted news/fundamentals、misspecification、M0 break、M1、M2、noise。',pit:'当前没有获准的 positive M3 signal；控制 rivals 不会通过排除法生成 M3。',signal:'No authorized positive discriminator；unexplained S remains U。',model:'No positive M3 model authorized; P(M3 | F_t) would not create identifiability',ancestry:'G1-04; CL-M3-001; CL-PF-007; CL-B4-001'},
U:{name:'Unresolved / Abstain',kind:'epistemic state — not mechanism',tone:'u',definition:'PIT evidence 不足、冲突或不确定性过高，无法负责任地赋予经济机制。不是第五种经济机制。',opportunity:'Abstain / wait / no-trade',money:'可能通过避免强制错误来保护资本；经济价值必须以后验证。',resolution:'later information may clarify or remain unresolved；不能追溯重标。',maturity:'FROZEN ROLE',ident:'EPISTEMIC, NOT ECONOMIC',known:'U 必须可表示，是合法输出。',unknown:'representation、calibration、update/transition 与 decision policy。',rivals:'任何 M0–M3、missing/stale data、measurement failure、conflicting evidence。',pit:'evidence sufficiency、conflict、staleness、relationship uncertainty。',signal:'quality/conflict state across P/S/C/R；不是 mechanism score。',model:'U_t = abstain when evidence is insufficient or ambiguous',ancestry:'D-014; G1-04; G2 Handoff; competing-mechanism Claim block'}};
const progress=[['Economic mechanism definition','DEFINED'],['Literature ancestry','REVIEWED'],['Identification boundary','PARTIAL'],['Relationship signal design','G2 PENDING'],['Abnormality / detection measurement','G2 PENDING'],['Mechanism discriminator measurement','G2 PENDING'],['Rejection / rival measurement','G2 PENDING'],['Sequential updating specification','G2 PENDING'],['Resolution model','NOT STARTED'],['Data readiness','G3 PENDING'],['Model implementation','NOT STARTED'],['OOS mechanism validation','NOT STARTED'],['OOS resolution validation','NOT STARTED'],['Economic / after-cost validation','NOT STARTED']];
const registry=[['P0 market relationship layer','Relationship','M0 M1 M2 M3 U','distinct raw joint, exposure, conditional/residual, stability/break and signed/state families','returns; exposures; residuals; stability history','R_t = relationship(PIT history)','representation-dependent; no Pair Score','PIT history','fast observations + medium relationship state','CL-PF-002–007/009; G2-02 proposal','PROPOSED · P0 PRIMARY BENCHMARK'],['P1 economic/company layer','Relationship / Rejection','M0 M1 M2 M3 U','separate secondary economic relationship prior/context added to unchanged P0','dated company/product/exposure representations','P1 = P0 + declared economic layer','more information ≠ better model','dated disclosure vintage','slow prior · normally cached','CL-PF-001; D-016; G2-02 proposal','PROPOSED · INCREMENTAL VALIDATION REQUIRED'],['Relationship stability / break','Relationship / Rejection','M0 U','credibility of current normal reference','PIT relationship history','break_evidence_t','extreme observation ≠ break','history through decision time','medium relationship state','CL-PF-004/005','CANDIDATE · G2 PENDING'],['Continuous pair abnormality','Detection','M0 M1 M2 M3 U','observed departure from expected response','joint response; relationship state; uncertainty','A_t = departure(Y_t,R_t,U_t)','noise / break / multiple mechanisms','inputs available by t','fast abnormality/trigger','D-015/017; G2-01','CANDIDATE · UNRESOLVED'],['M1 source-link-timing','Discriminator / Updating','M1 U','linked event plus signed peer under-response','link vintage; event time; source/peer response','b_M1,t = h(link,event,underresponse,rivals)','common shock; private news; stale link','first-public and response through t','fast sequential update','CL-M1-001/003','SUPPORTED FOR G2 DESIGN'],['M1 rival checks','Rejection / Updating','M1 M0 U','weaken clean delayed-incorporation attribution','peer own-news; market/industry; pre-event move','—','not positive M0 alone','PIT timestamps','fast sequential update','CL-M1-001/003','SUPPORTED C/R CANDIDATE'],['M2 pressure source','Discriminator / Updating','M2 U','plausibly temporary source evidence','released flow context; lagged overlap; calendar','b_M2,t = h(source,liquidity,response,rivals)','motive/endogeneity; disclosure lag','lawful release time','slow prior + fast update','CL-M2-001/003','SUPPORTED FOR G2 DESIGN'],['M2 contamination / liquidity checks','Rejection / Updating','M2 M1 M0 U','separate pressure from information/proxy artifacts','flow construction; returns; volume; quotes; liquidity','—','flow contains returns; illiquidity ≠ oversupply','through decision time','fast sequential update','CL-M2-002/004; CL-B4-002','SUPPORTED CHECKS'],['M0 positive rejection','Rejection','M0 U','relationship/arbitrage invalidation','structural/link change; fundamentals; break; funding','reject_evidence_t','no M0 by elimination','mixed PIT releases','mixed latency','CL-M0-001; CL-PF-001/004/005','SUPPORTED FOR G2 DESIGN'],['M3 residual context','Discriminator / Rejection','M3 U','describe unexplained abnormality without label','fundamental/news controls; residual move','—','omitted information; misspecification','PIT controls only','fast / medium','CL-M3-001; CL-PF-007; CL-B4-001','DESCRIPTIVE ONLY · NON-IDENTIFIED'],['Resolution outputs','Resolution','M0 M1 M2 M3 U','direction; magnitude; timing; persistence; catch-up; reversal; normalization; break','frozen PIT history only','Q_t(outcome | F_t)','future realization cannot be input','prediction origin fixed at t','future validation','D-014; mechanism Claims','G2/G4 PENDING'],['Decision output','Decision','M0 M1 M2 M3 U','map beliefs and uncertainty to action','relationship; abnormality; beliefs; uncertainty','policy(inputs) → actions','costs; constraints; calibration','PIT inputs only','decision time','D-014; G1-04','NOT STARTED']];
const concepts=[['Conditional joint/response relationship','PIT expected joint behavior + distinct i→j and j→i response views with uncertainty.','R_t={JointLaw(Y_i,Y_j|I_t),Response(j|i,I_t),Response(i|j,I_t),Uncertainty_t}','G2-01 FROZEN SEMANTICS; formula illustrative only.'],['Relationship state / uncertainty / abnormality / break','当前 normal behavior、对它的 uncertainty、相对它的 unusual observation、以及 normal relationship 本身改变的证据。','A_t=departure(observed,R_t,uncertainty)','Definitions frozen; measurement unresolved.'],['Economic proximity','PIT company/product-market closeness；只作为 secondary candidate prior/context。','sim(i,j)=cosine(x_i,x_j)','CL-PF-001; P1 incremental validation required.'],['Raw distance / correlation / cointegration / residual dependence','不同 statistical relationship constructs；互不等价，无一般 winner。','D; corr; p_i-βp_j; e_i-e_j','CL-PF-002–007/009; no model selected.'],['Event-time provenance','decision time 可得信息与未来 validation outcome 必须隔离。','Input_t ⊂ information available by t','CL-M1-001/003; CL-M2 block.'],['Sequential beliefs','mechanism 与 resolution beliefs 可随新 PIT evidence 联合更新。','belief_(t+1)=update(belief_t,new evidence)','D-014/G1-04; no filter/classifier selected.']];
const papers=[['PF-001','Economic proximity','CL-PF-001'],['PF-004','Raw distance','CL-PF-002'],['PF-006','Relationship stability','CL-PF-004'],['PF-007','Relationship break','CL-PF-005'],['PF-008','Residual replication','CL-PF-003'],['PF-013','Residual dependence / FDR','CL-PF-006'],['M1-001','Source-link-timing','CL-M1-001'],['M2-001','Pressure-source context','CL-M2-001'],['M2-002','Flow contamination critique','CL-M2-002'],['M2-003','Narrow exogenous timing','CL-M2-003'],['M2-005','Illiquidity vs oversupply','CL-M2-004'],['B4-004','Permanent/transitory decomposition','CL-B4-002']];
function cls(s){s=s.toLowerCase();if(s.includes('weak')||s.includes('blocked')||s.includes('non-identified'))return'weak';if(s.includes('frozen')||s.includes('defined')||s.includes('reviewed'))return'frozen';if(s.includes('g2'))return'g2';if(s.includes('g3')||s.includes('pending')||s.includes('unresolved'))return'pending';if(s.includes('not started'))return'notstarted';return'partial'}function pill(s){return `<span class="pill ${cls(s)}">${s}</span>`}function pipe(){return `<div class="pipeline">${pipeline.map((x,i)=>`<div class="step ${i===3||i===4?'plus':''}"><strong>${x[0]}</strong>${x[1]}</div>`).join('')}</div>`}function section(title,desc,body){return `<div class="sectionhead"><h2>${title}</h2><p>${desc}</p></div>${body}`}
function stageView(){return section('Research Stage Map','整个项目现在走到哪里；canonical stage view。',`<div class="grid">${stages.map(s=>`<article class="card"><h3>${s[0]}</h3>${pill(s[1])}<p><b>What we know</b><br>${s[2]}</p><p><b>Next unresolved</b><br>${s[3]}</p><p class="ancestry">${s[4]}</p></article>`).join('')}</div><div class="callout">G2-01 semantics 已冻结；G2-02 仅为 proposal，G2-03 尚未授权。没有 factor、model、threshold、window、provider 或 trade rule 被选择。</div>`)}
function mechanismOverview(){return section('Mechanism & Signal Map','每个经济假设如何从 relationship 与 abnormality 走向 sequential evidence、resolution validation 与未来决策。',`${pipe()}<div class="callout"><b>G2-02 proposal：</b>P0 是 simpler PIT market relationship benchmark；P1 只增加 separate slow economic/company layer。P1 normally cached，且必须证明 incremental relationship-level value。两者都不是 detector、classifier 或 trade rule。</div><div class="callout"><b>不是 hard pipeline：</b>mechanism 与 resolution beliefs 可联合、连续、不确定地更新；U 保留 ambiguity。future catch-up / reversal / normalization 仅是 validation outcome。</div><div class="grid">${Object.entries(mech).map(([k,m])=>`<article tabindex="0" role="link" class="card mechanism ${m.tone}" onclick="openMech('${k}')" onkeydown="if(event.key==='Enter')openMech('${k}')"><div class="eyebrow" style="color:var(--muted)">${m.kind}</div><h3>${k} · ${m.name}</h3>${pill(m.maturity)} ${pill(m.ident)}<p>${m.definition}</p><p class="money">${m.opportunity} → ${m.money}</p><p class="ancestry">${m.ancestry}</p></article>`).join('')}</div><div class="callout danger"><b>Boundary:</b> opposite-direction movement ≠ automatically abnormal；opposite-direction movement ≠ M3；not M1 + not M2 + not M0 ≠ M3。</div>`)}function openMech(k){location.hash='mechanism/'+k}
function mechDetail(k){const m=mech[k];const prog=progress.map(([x,s])=>[x,(k==='M3'&&x==='Mechanism discriminator measurement')?'BLOCKED — NO POSITIVE ID':(k==='U'&&x==='Economic mechanism definition')?'FROZEN EPISTEMIC ROLE':s]);return `<button class="back" onclick="location.hash='mechanism'">← Mechanism overview</button><div class="detailnav">${Object.keys(mech).map(x=>`<button class="${x===k?'active':''}" onclick="openMech('${x}')">${x}</button>`).join('')}</div>${section(`${k} · ${m.name}`,m.kind,`<div class="split"><article class="card ${m.tone}"><div class="facts"><div class="fact"><b>1. Definition</b>${m.definition}</div><div class="fact"><b>2. Economic intuition</b>${k==='U'?'不把 uncertainty 隐藏在强制分类中。':'相对 frozen conditional relationship 解释 abnormal joint response。'}</div><div class="fact"><b>3. Opportunity</b>${m.opportunity}</div><div class="fact"><b>4. Make / preserve money</b>${m.money}</div><div class="fact"><b>5. What we know</b>${m.known}</div><div class="fact"><b>6. What we do not know</b>${m.unknown}</div><div class="fact"><b>7. Competing interpretations</b>${m.rivals}</div><div class="fact"><b>8. PIT evidence supported</b>${m.pit}</div><div class="fact"><b>9. Expected resolution</b>${m.resolution}</div><div class="fact"><b>10. Signal Architecture</b>${m.signal}</div><div class="fact"><b>11. Candidate Model Architecture</b>${pill('ILLUSTRATIVE / UNAUTHORIZED')}<div class="formula">${m.model}</div></div><div class="fact"><b>13. Concepts / Papers / Claims</b>${m.ancestry}</div></div><div class="callout">signal concept ≠ candidate measurement ≠ frozen factor ≠ model output ≠ trade rule。</div></article><aside class="card"><h3>12. Research / Model Progress</h3><div class="progress">${prog.map(([x,s])=>`<div>${x}</div><div>${pill(s)}</div>`).join('')}</div></aside></div>`)}`}
let activeRole='All';function registryView(){const roles=['All','Relationship','Detection','Discriminator','Updating','Rejection','Resolution','Decision'];const rows=registry.filter(r=>activeRole==='All'||r[1].includes(activeRole));return section('Cross-Mechanism Signal Model Registry','仅 backfill 已有 ancestry。Candidate inputs 不是 factor list，也不代表 provider/data selection。',`<div class="callout">${pill('ILLUSTRATIVE / UNAUTHORIZED')} 所有公式与 model family 仅用于解释。future outcomes 不得进入 event-time mechanism inference。</div><div class="filters">${roles.map(x=>`<button class="${x===activeRole?'active':''}" onclick="activeRole='${x}';render()">${x}</button>`).join('')}</div><div style="overflow:auto"><table><thead><tr><th>Name / role</th><th>Mechanisms</th><th>Construct / inputs</th><th>Illustrative model</th><th>Rival · PIT · latency</th><th>Ancestry / status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b><br>${pill(r[1])}</td><td>${r[2]}</td><td>${r[3]}<br><span class="muted">Inputs: ${r[4]}</span></td><td>${r[5]==='—'?'—':`${pill('UNAUTHORIZED')}<div class="formula">${r[5]}</div>`}</td><td>${r[6]}<br><span class="muted">PIT: ${r[7]}<br>${r[8]}</span></td><td>${r[9]}<br>${pill(r[10])}</td></tr>`).join('')}</tbody></table></div>`)}
function conceptView(){return section('Defined Concepts / Candidate Models','定义已知不等于项目已经选择。',`<div class="grid">${concepts.map(c=>`<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p><details><summary>Conceptual form</summary>${pill('ILLUSTRATIVE / UNAUTHORIZED FORMULA')}<div class="formula">${c[2]}</div><p>${c[3]}</p></details></article>`).join('')}</div>`)}function paperView(){return section('Reviewed Paper Guides','Paper Guides 是教学 drill-down；Evidence authority 仍在 Claim register 与 review artifacts。',`<div class="grid">${papers.map(p=>`<article class="card"><h3>${p[0]}</h3><p>${p[1]}</p><p class="ancestry">${p[2]} · learning/paper-guides/${p[0]}.md</p></article>`).join('')}</div>`)}
function render(){const h=(location.hash||'#mechanism').slice(1),[view,key]=h.split('/');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));app.innerHTML=view==='stage'?stageView():view==='registry'?registryView():view==='concept'?conceptView():view==='paper'?paperView():key?mechDetail(key):mechanismOverview();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.view);window.addEventListener('hashchange',render);render();
</script></body></html>
